name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry publishing (leave empty to prepare releases)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && !inputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      created: ${{ steps.tag.outputs.release_created || steps.release.outputs.release_created }}
      sha: ${{ steps.tag.outputs.sha || steps.release.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR only bumps versions and the changelog; the checks job verifies
      # the tagged commit before publishing. A GITHUB_TOKEN merge does not retrigger
      # this workflow, so the release is tagged in this run.
      - name: Merge the release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r .number <<< "$RELEASE_PR")
          for attempt in 1 2 3 4 5 6; do
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch && exit 0
            sleep 10
          done
          exit 1
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: tag
        if: steps.release.outputs.pr != ''
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  checks:
    needs: release
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.release.outputs.created == 'true' || inputs.tag != '')
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.tag || needs.release.outputs.sha }}

  publish:
    needs: [release, checks]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' &&
      (needs.release.outputs.created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error("Release tag must match package.json version");
            }
          '
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("Expected a published stable release") else . end'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run build
      # The checks job ran verify:release on this commit; build dist in this clean job.
      - name: Publish to npm using OIDC
        run: npm publish --access public --ignore-scripts
