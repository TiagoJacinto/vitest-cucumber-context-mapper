name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # Squash merges use the PR title as the commit subject; release-please reads it.
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! grep -Eq "$pattern" <<< "$TITLE"; then
            echo "::error::PR title must follow Conventional Commits, for example 'feat: add X' or 'fix: handle Y'."
            exit 1
          fi
